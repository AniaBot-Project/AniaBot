# AniaBot 默认配置（首次启动时写入数据库，之后请在 Web 控制面板中修改）
# 持久化存储位置由环境变量引导（ANIABOT_STORE_DRIVER / ANIABOT_SQLITE_PATH / ANIABOT_MYSQL_DSN），不在此处配置
bot:
  # 管理员 ID 列表（可配置多个，每行一个；QQ 为 qq:QQ号，其他平台为带前缀的 ID，如 fs:ou_xxx）
  admin_ids:

  # Web 控制面板
  admin_panel:
    enable: true # 是否启用 Web 控制面板
    listen: "127.0.0.1:7700" # 监听地址（如需局域网访问改为 0.0.0.0:7700，注意面板有密码保护）

  # 平台适配器启用开关（可多平台并存：QQ + QQ 官方 + 飞书 + Telegram + Discord……）。默认仅启用 QQ(NapCat)。
  platform:
    napcat:
      enable: true # 是否启用 QQ 平台
    luckylilia:
      enable: false # 是否启用 QQ(Luckylilia/LLBot) 平台（OneBot v11 协议端；与 NapCat 可并存，群/好友 ID 前缀为 lil:，需同时配置下方 bot.luckylilia.*）
    qqofficial:
      enable: false # 是否启用 QQ 官方平台（需同时配置下方 bot.qqofficial.*）
    feishu:
      enable: false # 是否启用飞书平台（需同时配置下方 bot.feishu.*）
    telegram:
      enable: false # 是否启用 Telegram 平台（需同时配置下方 bot.telegram.*）
    discord:
      enable: false # 是否启用 Discord 平台（需同时配置下方 bot.discord.*）
    weixin:
      enable: false # 是否启用微信平台（需同时配置下方 bot.weixin.*；启用后首次连接需在控制台扫码登录）

  # QQ 官方适配器（QQ 开放平台 API v2，WebSocket 网关收事件，无需公网地址）
  qqofficial:
    app_id: # QQ 开放平台管理端「开发 → 开发设置」中的机器人 AppID
    app_secret: # 机器人 AppSecret（用于换取 access_token；旧 Token 鉴权已废弃）
    sandbox: false # 沙箱环境开关（机器人未上架前只能连接沙箱环境联调）
    api_base: https://api.sgroup.qq.com # OpenAPI 地址（沙箱开关优先于此配置）
    markdown: false # AI 文本回复以 Markdown 消息发送（发送失败自动降级纯文本）

  # 飞书适配器
  feishu:
    app_id: # 飞书开放平台「凭证与基础信息」中的应用 App ID
    app_secret: # 飞书开放平台「凭证与基础信息」中的应用 App Secret
    mode: ws # 事件订阅方式：ws（WebSocket 长连接，推荐，无需公网地址）| webhook（需公网 HTTPS 回调）
    webhook:
      listen: "127.0.0.1:7777" # webhook 模式本地监听地址
      path: /webhook/event # webhook 模式回调路径
      verification_token: # webhook 模式在飞书「事件订阅」页配置
      encrypt_key: # webhook 模式可选的事件加密密钥

  # Telegram 适配器（Bot API 长轮询，无需公网地址）
  telegram:
    token: # 向 @BotFather 创建机器人后获取的 Bot Token
    api_base: https://api.telegram.org # 官方 Bot API 地址；国内部署可填自建 Bot API 网关/反代
    proxy: # HTTP/SOCKS5 代理（http://host:port 或 socks5://host:port），留空直连
    polling:
      timeout: 30 # getUpdates 长轮询等待秒数（建议 10-50）

  # Discord 适配器（discordgo，Gateway WebSocket 收事件，无需公网地址）
  discord:
    token: # Discord Developer Portal → Bot 页面的 Token（必须同时开启 Message Content Intent）
    proxy: # HTTP/SOCKS5 代理（http://host:port 或 socks5://host:port），留空直连
    member_events: false # 接收服务器成员进出事件（需在 Developer Portal 开启 Server Members Intent）

  # 微信适配器（iLink bot，HTTP 长轮询收消息，无需公网地址；仅 bot↔用户 1:1 私聊）
  weixin:
    token: # 扫码登录凭据：一般留空，启用平台后首次连接会在控制台展示二维码；token 失效时同样在控制台重新扫码
    api_base: https://ilinkai.weixin.qq.com # iLink Bot API 地址（登录成功后自动记录服务端下发的专属地址）
    cdn_base: https://novac2c.cdn.weixin.qq.com/c2c # 微信媒体 CDN 地址（图片/文件上传下载）
    state_dir: ./data/weixin # 登录凭据与长轮询游标的保存目录（建议放在 data 卷）
    bot_type: "3" # 扫码登录的 ilink bot 类型

  # napcat网络交换适配器，websocket/http二选一
  adapter:
    mode: ws # 连接模式：ws（WebSocket，推荐）| http（Webhook 上报）
    # token: 如果设置token，请设置该字段
    ws:
      address: ws://localhost:4455 # websocket 地址，napcat的ws server地址
      worker_count: 0 # 处理线程数，设置为0自动调整
      worker_queue_size: 1024 # 消息队列，消息超出此限制则丢弃消息
    http:
      listen_port: 6679 # 本地监听端口，用于napcat向bot上报事件。注意这里如果是docker的话使用localhost无法连接，建议换成内网ip，即在napcat配置页面的http client设置为ip
      target_url: http://localhost:6680 # napcat开放的url，用于bot向napcat上报事件
    request_timeout_sec: 10 # 普通请求等待 NapCat 回包的秒数，超时按失败处理
    upload_timeout_sec: 120 # 发送文件/视频/语音等需先上传内容的消息时的等待秒数，大文件或慢网络可调大

  # Luckylilia(LLBot) 适配器（OneBot v11 QQ 协议端，与 NapCat 同类；websocket/http二选一）
  luckylilia:
    mode: ws # 连接模式：ws（WebSocket，推荐）| http（Webhook 上报）
    # token: LLBot 侧设置了 token 时填写（Authorization: Bearer 方式携带）
    ws:
      address: ws://localhost:3001 # websocket 地址，LLBot 的 WebSocket 正向服务地址
      worker_count: 0 # 处理线程数，设置为0自动调整
      worker_queue_size: 1024 # 消息队列，消息超出此限制则丢弃消息
    http:
      listen_port: 6689 # 本地监听端口，用于LLBot向bot上报事件（与 napcat 的 6679 区分）
      target_url: http://localhost:6690 # LLBot 开放的 url，用于bot调用 LLBot 接口（发消息等）
    request_timeout_sec: 10 # 普通请求等待 LLBot 回包的秒数，超时按失败处理
    upload_timeout_sec: 120 # 发送文件/视频/语音等需先上传内容的消息时的等待秒数，大文件或慢网络可调大

  # 缓存存储（易失，支持 TTL 与列表语义）
  store:
    cache:
      driver: memory # memory（默认，进程内内存，零依赖，重启清空） | redis（需 Redis 服务，支持多实例共享）
      redis:
        address: "localhost:6379"
        password: ""
        db: 0

# 原独立 JSON 配置文件的内容（MCP 服务器 / 群与好友 Prompt 覆盖），在 Web 面板「文件」页编辑
files:
  mcp_json: ""
  prompt_json: ""

# 插件自定义配置
plugin:

  # 拦截器插件
  interceptor:
    # 是否启用请求拦截，关闭时放行全部消息
    enable: false
    # 名单模式：blacklist=名单内屏蔽；whitelist=仅名单内放行
    mode: blacklist
    # 群 ID 名单（每行一个；QQ 为 qq:群号，其他平台为带前缀的群 ID，如 fs:oc_xxx）
    groups: []
    # 用户 ID 名单（每行一个；QQ 为 qq:QQ号，其他平台带前缀，如 fs:ou_xxx；对私聊及群聊消息发送者均生效）
    friends: []
